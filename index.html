<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>طقس العالم | Global Weather App</title>
    <style>
        :root {
            --font-ar: 'Segoe UI', 'Tahoma', 'Cairo', system-ui, -apple-system, sans-serif;
            --font-en: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.14);
            --glass-bg-strong: rgba(15, 23, 42, 0.42);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
            --gold: #fde047;
            --sky: #38bdf8;
            --rose: #fb7185;
            --emerald: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-ar);
            color: #ffffff;
            min-height: 100vh;
            transition: background 0.8s ease;
            overflow-x: hidden;
            line-height: 1.5;
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 45%, #38bdf8 85%, #f59e0b 100%);
        }

        html[dir="ltr"] body {
            font-family: var(--font-en);
        }

        /* Adaptive Weather Sky Gradients */
        body.theme-sunny {
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 45%, #38bdf8 85%, #f59e0b 100%);
        }
        body.theme-cloudy {
            background: linear-gradient(135deg, #1e293b 0%, #475569 55%, #64748b 100%);
        }
        body.theme-rainy {
            background: linear-gradient(135deg, #090d16 0%, #1e3a8a 55%, #1e293b 100%);
        }
        body.theme-night {
            background: linear-gradient(135deg, #020617 0%, #0f172a 55%, #1e1b4b 100%);
        }
        body.dark-forced {
            background: linear-gradient(135deg, #020617 0%, #090d16 60%, #0f172a 100%) !important;
        }

        .app-shell {
            max-width: 1340px;
            margin: 0 auto;
            padding: 14px;
        }

        @media (min-width: 768px) {
            .app-shell { padding: 22px; }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-2px);
        }

        /* 1. TOP BANNER: Student Name & Supervisor Side-by-Side */
        .credits-bar {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 640px) {
            .credits-bar {
                grid-template-columns: 1fr 1fr;
            }
        }

        .credit-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 13px 20px;
            border-radius: 20px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .credit-badge {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .credit-badge.student {
            background: rgba(253, 224, 71, 0.2);
            color: var(--gold);
            border: 1px solid rgba(253, 224, 71, 0.45);
        }

        .credit-badge.supervisor {
            background: rgba(56, 189, 248, 0.2);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.45);
        }

        .credit-title {
            font-size: 0.76rem;
            opacity: 0.85;
            display: block;
            font-weight: 600;
        }

        .credit-name {
            font-size: 1.02rem;
            font-weight: 800;
            color: #ffffff;
        }

        /* 2. APP HEADER & SEARCH */
        .app-header {
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            position: relative;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(253, 224, 71, 0.28), rgba(56, 189, 248, 0.28));
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-h1 {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        .brand-sub {
            font-size: 0.78rem;
            opacity: 0.85;
        }

        .search-box {
            position: relative;
            flex: 1 1 290px;
            max-width: 520px;
        }

        .search-field {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            padding: 4px 12px;
            transition: all 0.2s;
        }

        .search-field:focus-within {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--gold);
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 9px 10px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.75);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.26);
            color: #fff;
            padding: 8px 13px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.32);
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            inset-inline-start: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.97);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.26);
            border-radius: 18px;
            max-height: 310px;
            overflow-y: auto;
            z-index: 120;
            display: none;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        }

        .search-results.open { display: block; }

        .search-row {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-row:last-child { border-bottom: none; }
        .search-row:hover { background: rgba(255, 255, 255, 0.16); }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lang-dropdown {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .lang-dropdown option {
            background: #0f172a;
            color: #fff;
        }

        /* 3. FAVORITES & DIRECTORY BAR */
        .favorites-bar {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 10px 16px;
            overflow-x: auto;
        }

        .favorites-bar.has-items {
            display: flex;
        }

        .fav-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--gold);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .directory-panel {
            padding: 16px 20px;
            margin-bottom: 18px;
        }

        .dir-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .dir-title {
            font-size: 0.96rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-count {
            background: rgba(253, 224, 71, 0.22);
            color: var(--gold);
            border: 1px solid rgba(253, 224, 71, 0.42);
            font-size: 0.72rem;
            padding: 2px 9px;
            border-radius: 99px;
            font-weight: 800;
        }

        .dir-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-filter {
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 11px;
            padding: 7px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            width: 185px;
        }

        .quick-filter::placeholder { color: rgba(255, 255, 255, 0.68); }

        .region-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tab-pill {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.92);
            padding: 7px 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-pill:hover { background: rgba(255, 255, 255, 0.22); }

        .tab-pill.active {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(253, 224, 71, 0.3);
        }

        .places-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .places-grid.expanded {
            flex-wrap: wrap;
            overflow-x: visible;
            max-height: 240px;
            overflow-y: auto;
        }

        .city-chip {
            background: rgba(255, 255, 255, 0.11);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 7px 13px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.81rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.18s;
        }

        .city-chip:hover { background: rgba(255, 255, 255, 0.25); }

        .city-chip.active {
            background: #ffffff;
            color: #0f172a;
            border-color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        /* 4. MAIN DASHBOARD LAYOUT */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .main-grid {
                grid-template-columns: 1.7fr 1.15fr;
            }
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Hero Card with Prominent High, Low & Humidity */
        .hero-box {
            padding: 24px;
            position: relative;
        }

        .hero-header-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 22px;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.84rem;
            opacity: 0.92;
            margin-bottom: 6px;
        }

        .status-pill {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(52, 211, 153, 0.24);
            border: 1px solid rgba(52, 211, 153, 0.5);
            color: #a7f3d0;
            font-weight: 800;
        }

        .city-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .city-h2 {
            font-size: 2.1rem;
            font-weight: 900;
            line-height: 1.15;
        }

        .fav-toggle-btn {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .fav-toggle-btn.saved {
            background: rgba(253, 224, 71, 0.25);
            border-color: var(--gold);
            color: var(--gold);
        }

        .current-temp-display {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }

        .temp-main-val {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
        }

        .cond-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cond-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--gold);
        }

        .feels-line {
            font-size: 0.88rem;
            opacity: 0.92;
        }

        /* Prominent Highlight Trio: Max Temp, Min Temp, Humidity */
        .trio-highlights {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .highlight-pill {
            padding: 14px 12px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.22);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .highlight-pill.max-card {
            border-bottom: 3px solid #fb923c;
        }
        .highlight-pill.min-card {
            border-bottom: 3px solid #38bdf8;
        }
        .highlight-pill.hum-card {
            border-bottom: 3px solid #34d399;
        }

        .hl-label {
            font-size: 0.78rem;
            opacity: 0.88;
            font-weight: 700;
        }

        .hl-value {
            font-size: 1.45rem;
            font-weight: 900;
        }

        .hl-value.max-txt { color: #fdba74; }
        .hl-value.min-txt { color: #7dd3fc; }
        .hl-value.hum-txt { color: #6ee7b7; }

        .hum-bar-bg {
            width: 80%;
            height: 5px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 2px;
        }

        .hum-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #34d399);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        .hero-icon-card {
            background: rgba(255, 255, 255, 0.11);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            padding: 18px 26px;
            text-align: center;
            animation: gentleFloat 4s ease-in-out infinite;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .local-clock {
            display: inline-block;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        /* Secondary 6 Metrics Grid */
        .metrics-subgrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
        }

        @media (min-width: 640px) {
            .metrics-subgrid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .sub-metric {
            padding: 12px;
            text-align: center;
        }

        .sub-metric-lbl {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .sub-metric-val {
            font-size: 0.96rem;
            font-weight: 800;
            margin-top: 2px;
        }

        /* Hourly Section & Interactive SVG Curve */
        .panel-box {
            padding: 22px;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .svg-chart-box {
            position: relative;
            width: 100%;
            height: 165px;
            margin-bottom: 14px;
            background: rgba(15, 23, 42, 0.25);
            border-radius: 18px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .chart-tip {
            position: absolute;
            background: rgba(15, 23, 42, 0.96);
            color: var(--gold);
            padding: 6px 11px;
            border-radius: 10px;
            font-size: 0.78rem;
