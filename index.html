<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>طقسي | متابعة حالة الطقس</title>

<style>
:root {
  --bg:#eef4ff;
  --card:#ffffff;
  --text:#172746;
  --muted:#71809b;
  --accent:#3478f6;
  --border:#dce6f5;
  --neon:#35e8ff;
  --neon2:#4778ff;
}
body.dark {
  --bg:#081426;
  --card:#13233b;
  --text:#edf4ff;
  --muted:#a4b4ce;
  --accent:#6198ff;
  --border:#293c58;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background-color:#081426;
  background-image:
    radial-gradient(circle at 78% 13%,#fff7d6 0 25px,rgba(255,247,214,.25) 27px,transparent 43px),
    radial-gradient(2px 2px at 12% 12%,#fff 98%,transparent),
    radial-gradient(2px 2px at 25% 28%,#d9eaff 98%,transparent),
    radial-gradient(2px 2px at 42% 10%,#fff 98%,transparent),
    radial-gradient(2px 2px at 57% 24%,#fff 98%,transparent),
    radial-gradient(2px 2px at 91% 32%,#fff 98%,transparent),
    radial-gradient(2px 2px at 8% 46%,#d9eaff 98%,transparent),
    radial-gradient(2px 2px at 36% 43%,#fff 98%,transparent),
    radial-gradient(2px 2px at 66% 47%,#fff 98%,transparent),
    radial-gradient(2px 2px at 84% 57%,#d9eaff 98%,transparent),
    radial-gradient(2px 2px at 18% 68%,#fff 98%,transparent),
    radial-gradient(2px 2px at 49% 73%,#fff 98%,transparent),
    radial-gradient(2px 2px at 73% 82%,#d9eaff 98%,transparent),
    radial-gradient(2px 2px at 94% 76%,#fff 98%,transparent),
    radial-gradient(ellipse at 50% 100%,#183552 0%,#0b1b31 48%,#050d1b 100%);
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;
  transition:background-color .25s,color .25s;
}

/* شاشة البداية السوداء */
#splashScreen {
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
  opacity:1;
  visibility:visible;
  transition:opacity .65s ease,visibility .65s ease;
}
#splashScreen.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.splash-rings {
  position:relative;
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:ringPulse 1.25s ease-in-out infinite;
}
.ring {
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.20);
  box-shadow:0 0 12px rgba(255,255,255,.06);
}
.ring-outer {
  width:180px;
  height:180px;
  border-top-color:#fff;
  border-right-color:#aaa;
  border-left-color:#555;
  border-bottom-color:#333;
  animation:spin 2s linear infinite;
}
.ring-middle {
  width:125px;
  height:125px;
  border-width:3px;
  border-top-color:#eee;
  border-right-color:#777;
  border-bottom-color:#333;
  border-left-color:#aaa;
  animation:spinReverse 1.5s linear infinite;
}
.ring-inner {
  width:70px;
  height:70px;
  border-width:3px;
  border-top-color:#fff;
  border-right-color:#aaa;
  border-bottom-color:#444;
  border-left-color:#ddd;
  animation:spin 1s linear infinite;
}
.ring-center {
  width:17px;
  height:17px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px #fff,0 0 24px rgba(255,255,255,.65);
  animation:centerPulse .8s ease-in-out infinite;
}
@keyframes spin {
  from {transform:rotate(0deg)}
  to {transform:rotate(360deg)}
}
@keyframes spinReverse {
  from {transform:rotate(360deg)}
  to {transform:rotate(0deg)}
}
@keyframes ringPulse {
  0%,100% {transform:scale(.88)}
  50% {transform:scale(1.08)}
}
@keyframes centerPulse {
  0%,100% {transform:scale(.75);opacity:.65}
  50% {transform:scale(1.35);opacity:1}
}

.container {max-width:900px;margin:auto;padding:18px}
.top {
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;flex-wrap:wrap;direction:ltr
}
.student {
  display:flex;flex-direction:column;align-items:stretch;gap:8px;
  width:fit-content;max-width:100%;text-align:center;direction:rtl;line-height:1.8
}
.student span,.student strong {
  position:relative;isolation:isolate;display:block;padding:8px 13px;
  border:1px solid #bba46d;border-radius:11px;color:#fff4d6;
  font-size:14px;font-weight:900;background:rgba(8,20,38,.84);
  overflow:hidden;box-shadow:0 0 8px rgba(187,164,109,.12)
}
.student strong {font-size:16px;color:#fff}
button,input {font:inherit}
button {cursor:pointer}
.theme {
  position:relative;isolation:isolate;background:var(--card);color:var(--text);
  border:1px solid var(--border);border-radius:13px;padding:11px 14px;font-weight:bold
}
header {text-align:center;padding:28px 0 16px}
.logo {font-size:48px}
h1 {margin:5px 0 10px;font-size:36px;color:#fff;text-shadow:0 2px 12px #0006}
.subtitle {color:#edf4ff;line-height:1.9;font-size:14px;text-shadow:0 1px 6px #000}
.search {display:flex;gap:8px;margin:18px 0 10px}
.input-frame {
  position:relative;isolation:isolate;flex:1;min-width:0;border-radius:13px;
  padding:2px;background:var(--card)
}
.input-frame input {
  display:block;width:100%;min-width:0;padding:12px;border:0;border-radius:11px;
  background:var(--card);color:var(--text);outline:none
}
.primary {
  background:var(--accent);color:white;border:0;border-radius:13px;
  padding:12px 18px;font-weight:bold;animation:searchPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 8px #3478f680;transition:transform .2s
}
.primary:active {transform:scale(.96)}
.location {
  position:relative;isolation:isolate;width:100%;margin:0 0 16px;
  background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:13px;padding:12px
}
.status {text-align:center;color:var(--muted);padding:10px;line-height:1.8}
.card {
  position:relative;isolation:isolate;background:var(--card);
  border:1px solid var(--border);border-radius:22px;padding:20px;
  margin:16px 0;box-shadow:0 10px 30px #00000018
}
.current-head {display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2 {margin:0 0 8px}
.muted {color:var(--muted);font-size:13px;line-height:1.8}
.weather {display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0}
.temp {position:relative;isolation:isolate;font-size:clamp(65px,15vw,100px);font-weight:bold;line-height:1.3}
.temp::before {
  content:attr(data-icon);position:absolute;z-index:-1;left:-5px;top:-10px;
  font-size:90px;opacity:.15;transform:rotate(-12deg)
}
.temp small {font-size:25px;vertical-align:top}
.desc {font-size:17px;font-weight:bold;margin-top:8px}
.big-icon {font-size:clamp(65px,15vw,100px)}
.details {display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.detail {
  position:relative;isolation:isolate;text-align:center;padding:13px 5px;
  border:1px solid var(--border);border-radius:14px;background:var(--bg)
}
.detail-icon {font-size:23px;margin-bottom:8px}
.detail-label {color:var(--muted);font-size:12px;margin-bottom:7px}
.detail-value {font-weight:bold;font-size:14px}
.forecast {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day {
  position:relative;isolation:isolate;text-align:center;border:1px solid var(--border);
  background:var(--bg);border-radius:14px;padding:13px 3px
}
.day-name {font-size:12px;color:var(--muted);margin-bottom:12px}
.day-icon {font-size:27px;margin-bottom:10px}
.day-temp {font-weight:bold;font-size:13px}
.day-low {color:var(--muted);font-size:12px;margin-top:7px}
footer {
  text-align:center;color:#edf4ff;font-size:13px;line-height:2;
  padding:20px 0;text-shadow:0 1px 5px #000
}

@property --neon-angle {
  syntax:"<angle>";initial-value:0deg;inherits:false
}
.theme::before,.location::before,.card::before,.detail::before,.day::before,.input-frame::before {
  content:"";position:absolute;inset:0;padding:2px;border-radius:inherit;
  background:conic-gradient(from var(--neon-angle),transparent 0deg,transparent 250deg,
    var(--neon2) 285deg,var(--neon) 315deg,#fff 325deg,var(--neon) 338deg,transparent 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  z-index:5;animation:neonTravel 3s linear infinite
}
.student span::before,.student strong::before {
  content:"";position:absolute;inset:0;padding:2px;border-radius:inherit;
  background:conic-gradient(from var(--gold-angle,0deg),transparent 0deg,transparent 275deg,
    #bba46d 300deg,#fff0bd 320deg,#bba46d 335deg,transparent 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  animation:goldTravel 4s linear infinite
}
@property --gold-angle {
  syntax:"<angle>";initial-value:0deg;inherits:false
}
@key
